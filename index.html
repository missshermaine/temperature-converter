<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #eef4fb; font-family: Arial, sans-serif; color: #192b40; }
    main { width: min(100%, 430px); padding: 30px; background: white; border-radius: 14px; box-shadow: 0 8px 28px #17345320; }
    h1 { margin: 0 0 8px; font-size: 25px; }
    .intro { margin: 0 0 24px; color: #526579; line-height: 1.5; }
    label { display: block; margin: 16px 0 7px; font-weight: bold; }
    input, select, button { width: 100%; padding: 12px; border-radius: 8px; font: inherit; }
    input, select { border: 1px solid #acbed0; background: white; }
    input:focus, select:focus, button:focus { outline: 3px solid #a9d4ff; outline-offset: 2px; }
    button { margin-top: 22px; border: 0; background: #1768c1; color: white; font-weight: bold; cursor: pointer; }
    button:hover { background: #10549e; }
    #result { margin: 20px 0 0; min-height: 24px; font-size: 19px; font-weight: bold; color: #12603b; }
    #errorMessage { margin: 9px 0 0; min-height: 20px; color: #b42318; }
  </style>
</head>
<body>
  <main>
    <h1>Temperature Converter</h1>
    <p class="intro">Enter a temperature and choose the unit you are converting from.</p>
    <label for="temperatureInput">Temperature</label>
    <input id="temperatureInput" type="text" inputmode="decimal" placeholder="For example, 36" autocomplete="off">
    <label for="sourceUnit">Convert from</label>
    <select id="sourceUnit">
      <option value="celsius">Celsius (°C) to Fahrenheit (°F)</option>
      <option value="fahrenheit">Fahrenheit (°F) to Celsius (°C)</option>
    </select>
    <button id="convertButton" type="button">Convert</button>
    <p id="result" role="status" aria-live="polite"></p>
    <p id="errorMessage" role="alert"></p>
  </main>
  <script>
    const temperatureInput = document.getElementById('temperatureInput');
    const sourceUnit = document.getElementById('sourceUnit');
    const convertButton = document.getElementById('convertButton');
    const result = document.getElementById('result');
    const errorMessage = document.getElementById('errorMessage');

    // Keep each formula in its own function so its purpose is clear and easy to check.
    function celsiusToFahrenheit(celsius) {
      return (celsius * 9 / 5) + 32;
    }

    function fahrenheitToCelsius(fahrenheit) {
      return (fahrenheit - 32) * 5 / 9;
    }

    function convertTemperature() {
      const enteredText = temperatureInput.value.trim();
      result.textContent = '';
      errorMessage.textContent = '';

      // An empty field should prompt the user instead of being treated as zero.
      if (enteredText === '') {
        errorMessage.textContent = 'Please enter a temperature.';
        return;
      }

      const enteredTemperature = Number(enteredText);
      // Reject invalid numbers and values outside the finite range JavaScript can display.
      if (!Number.isFinite(enteredTemperature)) {
        errorMessage.textContent = 'Please enter a valid number.';
        return;
      }

      let convertedTemperature;
      let originalUnit;
      let convertedUnit;
      // The selected source unit decides which conversion formula to apply.
      if (sourceUnit.value === 'celsius') {
        convertedTemperature = celsiusToFahrenheit(enteredTemperature);
        originalUnit = '°C';
        convertedUnit = '°F';
      } else {
        convertedTemperature = fahrenheitToCelsius(enteredTemperature);
        originalUnit = '°F';
        convertedUnit = '°C';
      }

      if (!Number.isFinite(convertedTemperature)) {
        errorMessage.textContent = 'That temperature is too large to convert.';
        return;
      }
      // Show a readable answer while keeping the numeric result accurate to two decimals.
      result.textContent = `${enteredTemperature} ${originalUnit} = ${convertedTemperature.toFixed(2)} ${convertedUnit}`;
    }

    // Convert when clicked; the page stays open so another value can be tried immediately.
    convertButton.addEventListener('click', convertTemperature);
  </script>
</body>
</html>
